
name: Deploy Workflow

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        env:
          ECR: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR/app-backend:$TAG ./backend
          docker tag $ECR/app-backend:$TAG $ECR/app-backend:latest
          docker push $ECR/app-backend:$TAG
          docker push $ECR/app-backend:latest

      - name: Build and push frontend
        env:
          ECR: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR/app-frontend:$TAG ./frontend
          docker tag $ECR/app-frontend:$TAG $ECR/app-frontend:latest
          docker push $ECR/app-frontend:$TAG
          docker push $ECR/app-frontend:latest

      - name: Update backend task definition
        id: backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs-task-definition.json
          container-name: backend
          image: ${{ steps.login-ecr.outputs.registry }}/app-backend:${{ github.sha }}

      - name: Update frontend task definition
        id: frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.backend.outputs.task-definition }}
          container-name: frontend
          image: ${{ steps.login-ecr.outputs.registry }}/app-frontend:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.frontend.outputs.task-definition }}
          service: my-service
          cluster: my-cluster
          wait-for-service-stability: true

      - name: Deployment success
        run: echo "Frontend and backend deployed successfully to ECS!"
