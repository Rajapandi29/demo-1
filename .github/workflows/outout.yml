
name: Output Workflow

on:
  push:
    branches:
      - main

jobs:
  output:
    runs-on: ubuntu-latest

    steps:
      - name: Print greeting
        run: echo "Hello Rajapandi!"

      - name: Print frontend message
        run: echo "Frontend application is running!"

      - name: Print backend message
        run: echo "Backend application is running!"

      - name: Print Docker message
        run: echo "Docker containers are ready!"

      - name: Print AWS deployment message
        run: echo "AWS deployment workflow completed!"

      - name: Print goodbye
        run: echo "Thank you! Workflow execution completed successfully."

      - name: checkout repository
        uses: actions/checkout@v4

      - name: cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            ~/.cache

      - name: Install dependencies
        run: npm install

      - name: Create build directory
        run: |
          mkdir -p dist
          echo "Build artifact created successfully!" > dist/output.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: downloaded-files/
